name: Build MLW APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q MLW_League_Office_Android_Project.zip -d android-project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

  

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-project
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-project/app/build/outputs/apk/debug/app-debug.apk MLW-League-Office.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MLW-League-Office-APK
          path: MLW-League-Office.apk
